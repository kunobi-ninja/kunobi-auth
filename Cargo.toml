[package]
name = "kunobi-auth"
version = "1.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 AND MIT"
description = "Authentication framework for Kunobi services — OIDC login, JWT validation, token management"
repository = "https://github.com/kunobi-ninja/kunobi-auth"
readme = "README.md"
keywords = ["oidc", "authentication", "jwt", "kubernetes", "operator"]
categories = ["authentication", "web-programming"]
# Publish only what builds the library. Tests, fuzz targets, CI and tool output
# (such as cargo-mutants runs) stay in the repository.
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/LICENSES/jsonwebtoken-MIT"]

[workspace]
members = ["crates/openidconnect", "crates/ssh-agent-client"]
resolver = "3"

[features]
default = ["client", "browser-login", "server", "rust_crypto", "aws-lc-tls"]
# TLS for outbound HTTP (discovery, JWKS, token endpoint): reqwest's rustls
# with its bundled aws-lc-rs provider. Every feature below that makes HTTP
# calls implies it, except the `-core` variants.
aws-lc-tls = ["reqwest/rustls"]
# JWT provider selection. RustCrypto uses jsonwebtoken's public provider API;
# it does not enable jsonwebtoken's built-in `rust_crypto` feature. An existing
# application provider wins; when both auth features are enabled, RustCrypto
# is installed first. With neither enabled, the application installs a provider.
# The JWT extension uses current curve dependencies while retaining jsonwebtoken 11's API.
rust_crypto = [
    "dep:jwt-crypto-bigint",
    "dep:jwt-ed25519-dalek",
    "dep:jwt-hmac",
    "dep:jwt-p256",
    "dep:jwt-p384",
    "dep:jwt-rand",
    "dep:jwt-rsa",
    "dep:jwt-sha2",
]
aws_lc_rs = ["jsonwebtoken/aws_lc_rs"]
# Client token management: cached token store, refresh, revocation,
# introspection, device-grant. Axum-free.
client = ["client-core", "aws-lc-tls"]
# `client` without choosing a TLS provider, for consumers that keep aws-lc-rs
# out of their build (e.g. ring-only). HTTPS still works once the consumer
# installs a rustls CryptoProvider, which must happen before any HTTP client
# is built.
client-core = ["dep:dirs", "dep:tempfile", "dep:sysinfo", "dep:openidconnect", "dep:oauth2"]
# Interactive browser-based OIDC login (PKCE). Adds a localhost callback
# server (axum) + a browser opener. Separable so client consumers that
# drive their own login (e.g. desktop apps) avoid the axum dependency.
browser-login = ["browser-login-core", "client"]
# `browser-login` without a TLS provider; see `client-core`.
browser-login-core = ["client-core", "dep:open", "dep:axum"]
# Server-side axum integration: AuthLayer/tower, extractors, ConfiguredAuth,
# and `AuthError: IntoResponse`. The JWKS/JWT validation core (JwksManager),
# DPoP, SSH-signature verification, and audit log are available WITHOUT this
# (see `server-core`, which is always compiled and needs no feature).
server-core = []
server = ["server-core", "dep:axum", "dep:tower", "dep:http", "aws-lc-tls"]
mcp-server = ["server"]
# Provider-agnostic access-token grants for external APIs and MCP servers.
# Hosts own browser/UI and keychain integration; no OIDC session or Axum deps.
oauth-core = ["dep:async-trait", "dep:getrandom", "dep:url", "dep:zeroize", "tokio/io-util"]
# `oauth` with a TLS provider; see `client-core` for the `-core` rationale.
oauth = ["oauth-core", "aws-lc-tls"]
# OS keychain-backed token storage (macOS Keychain / Windows Credential
# Manager). Linux Secret Service can be added later via the keyring crate's
# `sync-secret-service` feature.
keyring = ["client-core", "dep:keyring"]

[dependencies]
# HTTP / Web
axum = { version = "0.8", optional = true }
reqwest = { version = "0.13", features = ["json", "form", "rustls-no-provider"], default-features = false }
tower = { version = "0.5", optional = true }
http = { version = "1", optional = true }

# OAuth access-token grants (independent of the OIDC identity client).
async-trait = { version = "0.1", optional = true }
getrandom = { version = "0.4", optional = true }
url = { version = "2", optional = true }
zeroize = { version = "1", optional = true }

# OIDC (client)
openidconnect = { package = "kunobi-openidconnect", version = "=4.0.1-kunobi.1", path = "crates/openidconnect", optional = true }
oauth2 = { version = "5.0", optional = true }

# OS keychain backend (optional `keyring` feature). Native backends only;
# Linux Secret Service is intentionally left out for now (add
# `sync-secret-service` when wiring Linux).
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JWT validation (server). Crypto backend is selected via this crate's
# `rust_crypto` / `aws_lc_rs` features — see [features] above.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem"] }

# Private RustCrypto JWT implementation. Its public signer/verifier traits remain
# jsonwebtoken's signature 2 API; the updated curves use signature 3 internally.
# The floor also constrains elliptic-curve's compatible crypto-bigint requirement.
jwt-crypto-bigint = { package = "crypto-bigint", version = "0.7.6", optional = true, default-features = false }
jwt-ed25519-dalek = { package = "ed25519-dalek", version = "2.1.1", optional = true, features = ["pkcs8"] }
jwt-hmac = { package = "hmac", version = "0.12.1", optional = true, features = ["reset"] }
jwt-p256 = { package = "p256", version = "0.14.0", optional = true, default-features = false, features = ["alloc", "ecdsa", "pkcs8", "precomputed-tables"] }
jwt-p384 = { package = "p384", version = "0.14.0", optional = true, default-features = false, features = ["alloc", "ecdsa", "pkcs8", "precomputed-tables"] }
jwt-rand = { package = "rand", version = "0.8.5", optional = true, default-features = false, features = ["std", "std_rng"] }
jwt-rsa = { package = "rsa", version = "0.9.6", optional = true }
jwt-sha2 = { package = "sha2", version = "0.10.7", optional = true, features = ["oid"] }

# Browser (client)
open = { version = "5", optional = true }

# Dirs (client)
dirs = { version = "7", optional = true }

# Atomic file writes for client TOFU + token stores
tempfile = { version = "3", optional = true }

# Cross-platform process introspection — used by `client::session` to
# derive the parent shell PID (per-shell session state) and to garbage-
# collect session files whose owning shell has exited. Picks up
# different OS-specific implementations behind a portable API so the
# same code works on Linux, macOS, and Windows. Minimum feature set
# (just process listings) — we don't read disk/cpu/network.
sysinfo = { version = "0.38", default-features = false, features = ["system"], optional = true }

# Time
chrono = { version = "0.4", features = ["serde"] }

# SSH key parsing
ssh-key = { version = "0.6", features = ["ed25519", "alloc", "rand_core"] }
ssh-encoding = "0.2"
sha2 = "0.11"

# Encoding
base64 = "0.23"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
ssh-agent-client-rs = { package = "kunobi-ssh-agent-client-rs", version = "=1.1.4-kunobi.1", path = "crates/ssh-agent-client" }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
# Property-based testing for parsers + boundaries.
proptest = "1.11"
