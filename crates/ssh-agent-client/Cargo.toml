[package]
name = "kunobi-ssh-agent-client-rs"
version = "1.1.4-kunobi.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kunobi-ninja/kunobi-auth"
description = """
Pure rust implementation of the ssh-agent protocol. It can be used to write clients that interact with the ssh agent.
"""
edition = "2024"
rust-version = "1.95"

[lib]
name = "ssh_agent_client_rs"

[dependencies]
bytes = "1.12"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ecdsa"] }
# Keep the encoding traits in the same family as ssh-key.
ssh-encoding = "0.2"
signature = "2.2"
thiserror = "2.0"

[dev-dependencies]
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519"] }
rand = "0.10"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
interprocess = "2.2"
