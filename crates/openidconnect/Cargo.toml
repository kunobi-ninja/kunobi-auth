[package]
name = "kunobi-openidconnect"
version = "4.0.1-kunobi.1"
authors = ["David A. Ramos <ramos@cs.stanford.edu>"]
description = "OpenID Connect library with maintained Kunobi cryptographic dependencies"
keywords = ["openid", "oidc", "oauth2", "authentication", "auth"]
license = "MIT"
repository = "https://github.com/kunobi-ninja/kunobi-auth"
edition = "2021"
readme = "README.md"
rust-version = "1.95"

[lib]
name = "openidconnect"

[package.metadata.docs.rs]
all-features = true

[badges]
maintenance = { status = "actively-developed" }

[features]
accept-rfc3339-timestamps = []
accept-string-booleans = []
curl = ["oauth2/curl"]
default = ["reqwest", "rustls-tls"]
native-tls = ["oauth2/native-tls"]
reqwest = ["oauth2/reqwest"]
reqwest-blocking = ["oauth2/reqwest-blocking"]
rustls-tls = ["oauth2/rustls-tls"]
timing-resistant-secret-traits = ["oauth2/timing-resistant-secret-traits"]
ureq = ["oauth2/ureq"]

[[example]]
name = "gitlab"
required-features = ["reqwest-blocking"]

[[example]]
name = "google"
required-features = ["reqwest-blocking"]

[[example]]
name = "okta_device_grant"
required-features = ["reqwest-blocking"]

[dependencies]
base64 = "0.23.1"
# Disable 'time' dependency since it triggers RUSTSEC-2020-0071 and we don't need it.
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "wasmbind"
] }
thiserror = "1.0"
http = "1.0"
itertools = "0.15.0"
log = "0.4"
oauth2 = { version = "5.0.0", default-features = false }
rand = "0.8.5"
hmac = "0.13.0"
# HMAC uses digest 0.11; RSA 0.9 still uses the sha2/digest 0.10 dependency below.
hmac-sha2 = { package = "sha2", version = "0.11.1", default-features = false }
rsa = "0.9.2"
sha2 = { version = "0.10.6", features = ["oid"] } # Object ID needed for pkcs1v15 padding
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdsa", "precomputed-tables"] }
p384 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdsa", "precomputed-tables"] }
# Keep the curves on the fixed backend even when resolving minimum versions.
crypto-bigint = { version = "0.7.6", default-features = false }
dyn-clone = "1.0.10"
serde = "1.0"
serde_json = "1.0"
serde_path_to_error = "0.1"
serde_plain = "1.0"
serde_with = "3"
serde-value = "0.7"
url = { version = "2.4", features = ["serde"] }
subtle = "2.4"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }

[dev-dependencies]
color-backtrace = { version = "0.7.4" }
env_logger = "0.11.11"
pretty_assertions = "1.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
retry = "2.2.0"
anyhow = "1.0"
