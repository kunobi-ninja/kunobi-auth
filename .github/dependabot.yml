version: 2
updates:
  # Cargo dependencies (workspace + member crates) — single grouped PR per week.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    ignore:
      # `ssh-encoding` is an implementation detail of `ssh-key`; the two must
      # move as a pair. Stable `ssh-key` (0.6.x) is pinned to `ssh-encoding`
      # 0.2, and `ssh-encoding` 0.3 only pairs with the `ssh-key` 0.7 RC line.
      # Bumping `ssh-encoding` to 0.3 on its own breaks the build (the 0.3
      # Encode/Decode traits don't match the 0.2 traits `ssh-key` implements).
      # Hold at 0.2 until `ssh-key` 0.7 ships stable, then bump both together
      # and drop this ignore.
      - dependency-name: "ssh-encoding"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      all-cargo:
        patterns:
          - "*"

  # GitHub Actions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"
