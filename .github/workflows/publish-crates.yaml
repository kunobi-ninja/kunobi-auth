name: Publish crate

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish kunobi-auth to crates.io
    runs-on: ubuntu-latest
    # crates.io OIDC Trusted Publishing: GitHub mints a short-lived OIDC token
    # (id-token: write), `rust-lang/crates-io-auth-action` exchanges it for a
    # scoped crates.io token, and `cargo publish` uses it — no long-lived
    # CARGO_REGISTRY_TOKEN secret. The Trusted Publisher must be configured on
    # crates.io (manual, by a crate owner) for `kunobi-auth`, pointing at this
    # repo + workflow file name, before the first publish can succeed.
    #
    # If the crates.io Trusted Publisher config pins a GitHub Environment, add
    # the matching `environment: <name>` here. The workflow file name and any
    # environment must stay in sync with crates.io's trusted-publisher claims.
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check release tag matches Cargo manifest version
        # The version gate: the release tag (`vX.Y.Z`, prerelease suffix
        # included) must equal the `version` in Cargo.toml. Hermetic (pure
        # manifest read) and fail-closed, so crates.io only ever gets the exact
        # manifest version the tag was checked against.
        run: |
          version="${RELEASE_TAG#v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$manifest_version" != "$version" ]; then
            echo "Cargo.toml version $manifest_version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches Cargo.toml version $manifest_version"

      - name: Package kunobi-auth
        run: cargo package -p kunobi-auth --locked

      - name: Authenticate to crates.io
        id: auth
        # Pinned to v1.0.4: the floating @v1 tag still runs on the deprecated
        # Node 20 runtime; v1.0.4 is the first node24 release.
        uses: rust-lang/crates-io-auth-action@v1.0.4

      - name: Publish kunobi-auth
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${RELEASE_TAG#v}"
          status="$(curl -sS -A kunobi-auth-publish-workflow -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/kunobi-auth/$version")"
          if [ "$status" = "200" ]; then
            echo "kunobi-auth $version is already published; nothing to do"
            exit 0
          fi
          if [ "$status" != "404" ]; then
            echo "unexpected crates.io status while checking kunobi-auth $version: $status" >&2
            exit 1
          fi
          cargo publish -p kunobi-auth --locked
