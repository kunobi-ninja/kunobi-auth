name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepublish:
        description: Validate unpublished companions without the root packaging gate
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Silence the Node 20 deprecation warning emitted by actions/checkout,
  # actions/cache, and upload-artifact. Node 24 becomes the default in June 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.prepublish == true && 'Prepublication Rust validation' || 'Rust Checks' }}
    runs-on: ubuntu-latest
    container:
      image: rust:1.99.1-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-rust1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust1.99.1-

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      # Installs Rust from .mise.toml so local and CI toolchains share one
      # source of truth.
      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust@1.99.1

      - name: Install coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin@0.35.4

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Test (OAuth library only)
        run: cargo test --no-default-features --features oauth --lib "oauth::"

      - name: Test (OAuth keychain compatibility)
        run: cargo test --no-default-features --features oauth --test oauth_compat_keychain

      - name: Build docs (OAuth only)
        run: cargo doc --lib --no-deps --no-default-features --features oauth

      - name: Verify standalone OAuth package
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prepublish == true) }}
        run: cargo package --locked --no-default-features --features oauth

      - name: Coverage
        run: cargo tarpaulin --engine llvm --all-features --workspace --out Json --output-dir coverage --fail-under 60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/tarpaulin-report.json
          if-no-files-found: warn

      - name: Build (all features)
        run: cargo build --all-features

      - name: Build (server only)
        run: cargo build --no-default-features --features server

      - name: Build (client only)
        run: cargo build --no-default-features --features client

      - name: Build docs
        run: cargo doc --lib --no-deps --all-features

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    container:
      image: rust:1.95.0-bookworm
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check workspace at MSRV
        run: cargo check --locked --workspace --all-features --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    container:
      image: rust:1.99.1-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: cargo-deny-${{ runner.os }}-

      - name: Install cargo-deny
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: aqua:EmbarkStudios/cargo-deny@0.19.4

      - name: cargo deny check
        run: cargo deny check

  companions:
    name: Companion regression tests
    runs-on: ubuntu-latest
    container:
      image: rust:1.99.1-bookworm
    timeout-minutes: 35
    needs: checks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-rust1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust1.99.1-

      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust@1.99.1

      - name: OIDC companion tests and examples
        run: cargo test --locked -p kunobi-openidconnect --all-features --all-targets

      - name: SSH agent companion tests and examples
        run: cargo test --locked -p kunobi-ssh-agent-client-rs --all-targets

      - name: RustCrypto provider compatibility
        run: cargo test --locked --no-default-features --features rust_crypto --test jwt_crypto_compat

      - name: AWS-LC provider compatibility
        run: cargo test --locked --no-default-features --features aws_lc_rs --test jwt_crypto_compat

      - name: Verify OIDC companion package
        run: cargo package --locked -p kunobi-openidconnect --all-features

      - name: Verify SSH agent companion package
        run: cargo package --locked -p kunobi-ssh-agent-client-rs

      - name: Upload verified companion packages
        uses: actions/upload-artifact@v7
        with:
          name: auth-companion-packages-${{ github.sha }}
          path: |
            target/package/kunobi-openidconnect-*.crate
            target/package/kunobi-ssh-agent-client-rs-*.crate
          if-no-files-found: error

  native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: jdx/mise-action@v4
        with:
          experimental: true
          install_args: rust@1.99.1

      - name: Native auth and keyring regressions
        run: cargo test --locked --all-features

      - name: Check iOS native keyring
        if: runner.os == 'macOS'
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          rustup target add --toolchain 1.99.1 aarch64-apple-ios
          cargo check --locked --target aarch64-apple-ios --no-default-features --features client-core,keyring,rust_crypto

  e2e:
    name: E2E (Dex)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ runner.os }}-rust1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-e2e-${{ runner.os }}-rust1.99.1-

      - name: Install build toolchain
        # Dex runs on GitHub's Ubuntu host so Docker remains available.
        # Install linking tools if the host does not already provide them.
        run: |
          if ! command -v cc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential pkg-config
          fi

      # Use the primary Rust 1.99.1 toolchain for Dex.
      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          experimental: true # .mise.toml also defines cargo-backed local tools
          install_args: rust@1.99.1

      - name: Build Dex image
        run: docker build -t kunobi-dex -f tests/fixtures/Dockerfile.dex tests/fixtures

      - name: Start Dex
        run: |
          docker run --rm -d --name kunobi-dex -p 5556:5556 kunobi-dex
          # Wait for Dex's discovery endpoint to come up.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5556/dex/.well-known/openid-configuration >/dev/null; then
              echo "Dex is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Dex did not start within 30s"
          docker logs kunobi-dex || true
          exit 1

      - name: Run e2e tests
        env:
          # Must match the `issuer:` field in tests/fixtures/dex-config.yaml
          # so the `iss` claim in JWTs matches what the validator expects.
          DEX_ISSUER: http://127.0.0.1:5556/dex
        # --test-threads=1: tests share a Dex instance and refresh-token
        # rotation invalidates earlier tokens, so they must run serially.
        run: cargo test --test e2e_dex --all-features -- --ignored --nocapture --test-threads=1

      - name: Dex logs (on failure)
        if: failure()
        run: docker logs kunobi-dex || true

      - name: Stop Dex
        if: always()
        run: docker rm -f kunobi-dex || true
